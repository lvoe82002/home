<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="一个用 Vue3 + Vite 搭建的个人主页，部署在 Cloudflare Pages。" />
    <title>举个栗子</title>

    <!-- 站酷快乐体：圆润 Q 弹的可爱字体。
         非阻塞加载：先用 media="print" 让浏览器不把它当渲染阻塞资源，
         onload 后再切回 all。字体 CDN 慢或不可达时页面也能立刻渲染，不会白屏。
         加载失败时回退到系统圆体（见 styles.css 的 --sans）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=ZCOOLKuaiLe&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
